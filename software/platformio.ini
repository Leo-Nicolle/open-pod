; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nucleo_f446re

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = arduino
debug_tool = stlink
monitor_speed = 115200
; Show what you type (the bring-up sketch in main.cpp takes typed commands).
monitor_echo = yes
upload_protocol = stlink
; main_bt_test.cpp is the FSC-BT1035 bring-up sketch: pio run -e bt_test.
; main_haptic.cpp is the DRV2605L/click-wheel haptic tuning sketch. To run it,
; swap it with main.cpp and exclude main.cpp here instead.
build_src_filter = +<*> -<main_haptic.cpp> -<main_display_bench.cpp> -<main_bt_test.cpp>
build_flags =
	-DUSE_UTF8_LONG_NAMES=1
	; On the hand-soldered prototype with dead PC14/PC15 (D14/D15 rerouted
	; to PA0/PA1) - see .agents/screen-red-problem.md. Comment out if you
	; ever build for a normal/working Nucleo instead.
	-DBROKEN_NUCLEO=1
	; The Bluetooth module sends ~200 bytes of events at once when it
	; (re)connects (core default: 64 bytes).
	-DSERIAL_RX_BUFFER_SIZE=256
	; Room for the once-a-second audio monitor/profiler lines without
	; blocking the main loop on Serial (core default is 64 bytes).
	-DSERIAL_TX_BUFFER_SIZE=1024
	; SdFat goes through SharedSpiDriver (src/storage/SharedSpiDriver.h), which
	; locks SPI1 against the VS1053 feeder interrupt.
	-DSPI_DRIVER_SELECT=3
	; Caps the VS1053 feeder's SPI clock (otherwise CLKI/4, 11.25 MHz with the
	; FLAC clock). On the breadboard, 11.25 MHz glitched while the wheel and
	; display were busy - before their I2C/bus traffic took the SPI1 lock.
	; Off since: at 5.6 MHz the feeder alone cost ~300 ms of CPU per second
	; of 24-bit FLAC (196 KB/s). Uncomment if the glitches come back.
	; -DOPENPOD_FEEDER_SDI_MAX_HZ=5625000
	; Uncomment to feed the VS1053 from the main loop instead of the timer
	; interrupt (diagnostic: isolates interrupt-context feeding).
	; -DOPENPOD_FEED_MAIN_LOOP
	; --- Logging and debug switches; full docs in src/logging.h ---
	; Checks LOG_* arguments against their printf formats.
	-Wformat
	; 0 = silent, 1 = errors/warnings, 2 = + info
	-DLOG_LEVEL=2
	; Per-category logs (0/1):
	-DLOG_AUDIO_BUFFER=1
	-DLOG_VS1053=0
	-DLOG_INDEX_USAGE=0
	-DLOG_USER_INPUT=0
	-DLOG_UI=0
	-DLOG_TELEMETRY=0
	-DLOG_BLUETOOTH=1
	; Debug features (0/1):
	-DDEBUG_WHEEL_TRACE=0
	-DDEBUG_DISPLAY_DIAGNOSTICS=0
	-DDEBUG_LINK_BENCH=0
	-DENABLE_HAPTICS=1
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit BusIO@^1.15.0
	arduino-libraries/SD@^1.3.0
	adafruit/Adafruit MPR121@^1.1.3
	adafruit/Adafruit DRV2605 Library@^1.2.4
	greiman/SdFat@^2.3.0

; Display bus throughput benchmark (src/main_display_bench.cpp), see
; docs/next-step-pinout.md. pio run -e display_bench -t upload
[env:display_bench]
extends = env:nucleo_f446re
build_src_filter = +<main_display_bench.cpp> +<sound/Spi1Bus.cpp> +<rendering/colors.cpp>

; FSC-BT1035 bring-up sketch (src/main_bt_test.cpp): scan, connect, I2S test
; tone/clip from the VS1053. pio run -e bt_test -t upload -t monitor
[env:bt_test]
extends = env:nucleo_f446re
build_src_filter = +<*> -<main.cpp> -<main_haptic.cpp> -<main_display_bench.cpp>

[env:test_native]
platform = native
framework = 
test_framework = doctest
build_type = test
debug_test = *
test_build_src = yes
build_src_filter = +<storage/*.cpp> +<sound/Audio_buffer.cpp> +<state/*.cpp> +<bluetooth/*.cpp> +<ui/list/utils.cpp> +<rendering/colors.cpp>
build_flags = 
	-std=c++11
	-DUNIT_TEST
	-DLOG_LEVEL=0
	-I include
	-I test/mocks
	-include pins_stm32.h
	-g
	-O0
lib_deps = 
	doctest

