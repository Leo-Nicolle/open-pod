; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nucleo_f446re

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = arduino
debug_tool = stlink
monitor_speed = 115200
upload_protocol = stlink
; main_haptic.cpp is the DRV2605L/click-wheel haptic tuning sketch. To run it,
; swap it with main.cpp and exclude main.cpp here instead.
build_src_filter = +<*> -<main_haptic.cpp>
build_flags =
	-DUSE_UTF8_LONG_NAMES=1
	; On the hand-soldered prototype with dead PC14/PC15 (D14/D15 rerouted
	; to PA0/PA1) - see .agents/screen-red-problem.md. Comment out if you
	; ever build for a normal/working Nucleo instead.
	-DBROKEN_NUCLEO=1
	; Room for the once-a-second audio monitor/profiler lines without
	; blocking the main loop on Serial (core default is 64 bytes).
	-DSERIAL_TX_BUFFER_SIZE=1024
	; SdFat goes through SharedSpiDriver (src/storage/SharedSpiDriver.h), which
	; locks SPI1 against the VS1053 feeder interrupt.
	-DSPI_DRIVER_SELECT=3
	; Caps the VS1053 feeder's SPI clock (otherwise CLKI/4, 11.25 MHz with the
	; FLAC clock). On the breadboard, 11.25 MHz glitched while the wheel and
	; display were busy - before their I2C/bus traffic took the SPI1 lock.
	; Off since: at 5.6 MHz the feeder alone cost ~300 ms of CPU per second
	; of 24-bit FLAC (196 KB/s). Uncomment if the glitches come back.
	; -DOPENPOD_FEEDER_SDI_MAX_HZ=5625000
	; Uncomment to feed the VS1053 from the main loop instead of the timer
	; interrupt (diagnostic: isolates interrupt-context feeding).
	; -DOPENPOD_FEED_MAIN_LOOP
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit BusIO@^1.15.0
	arduino-libraries/SD@^1.3.0
	adafruit/Adafruit MPR121@^1.1.3
	adafruit/Adafruit DRV2605 Library@^1.2.4
	greiman/SdFat@^2.3.0

[env:test_native]
platform = native
framework = 
test_framework = doctest
build_type = test
debug_test = *
test_build_src = yes
build_src_filter = +<storage/*.cpp> +<sound/Audio_buffer.cpp> +<state/*.cpp> +<ui/list/utils.cpp> +<rendering/colors.cpp>
build_flags = 
	-std=c++11
	-DUNIT_TEST
	-I include
	-I test/mocks
	-include pins_stm32.h
	-g
	-O0
lib_deps = 
	doctest

