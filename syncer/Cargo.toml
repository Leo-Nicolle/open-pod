[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/web", "app/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

# Dependencies (flacenc, symphonia, rubato, hashing) are optimized even in
# dev builds: unoptimized, a single FLAC re-encode takes minutes and a
# `tauri dev` sync looks hung. Our own crates stay fast to rebuild.
[profile.dev.package."*"]
opt-level = 3

# The sync's hot paths (probing, the Rust FLAC encoder): `tauri dev`
# converts ~2x slower without it.
[profile.dev.package.openpod-core]
opt-level = 3
# Incremental + optimized workspace crate: stale objects end in "undefined
# hidden symbol" link errors after edits. It rebuilds whole (~30 s).
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
