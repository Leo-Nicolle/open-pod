[package]
name = "openpod-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["native"]
# Desktop-only parts: the config file, card inspection (free space). The
# browser build (wasm32) turns it off.
native = ["dep:dirs", "dep:fs4", "dep:gethostname", "dep:toml", "dep:toml_edit"]

[dependencies]
dirs = { version = "7.0.0", optional = true }
fs4 = { version = "1.1.0", optional = true }
gethostname = { version = "1.1.0", optional = true }
toml = { version = "1.1.8", optional = true }
toml_edit = { version = "0.25", optional = true }
flacenc = "0.5.1"
hex = "0.4.3"
icu_collator = "2.3.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lofty = "0.25.4"
rayon = "1.12.0"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "wav", "aiff", "pcm", "mp3", "aac", "alac", "isomp4", "ogg", "vorbis"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
