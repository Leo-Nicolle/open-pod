[package]
name = "openpod-web"
description = "openpod-core for the browser (wasm-bindgen): the web version of OpenPod Sync"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
openpod-core = { path = "../core", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["Blob", "File", "FileReaderSync"] }
