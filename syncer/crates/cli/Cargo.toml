[package]
name = "openpod-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "openpod"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
fs4 = "1.1.0"
indicatif = "0.18.6"
openpod-core = { path = "../core" }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
