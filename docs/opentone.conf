# opentone.eu — static VitePress site. HTTP-only base config.
# Run `certbot --nginx -d opentone.eu -d www.opentone.eu` afterward; certbot
# will add the 443/listen ssl block and the HTTP->HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name opentone.eu www.opentone.eu;

    # Where .vitepress/dist is rsynced on the VPS. nginx (www-data) needs to
    # traverse /home/leo: `chmod o+x /home/leo`.
    root /home/leo/opentone;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               text/xml application/xml image/svg+xml application/wasm;

    # VitePress emits flat .html files (cleanUrls is off), so /about resolves
    # to /about.html and /manual/ to /manual/index.html. Unknown paths fall
    # through to the generated 404 page.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;

        # HTML must be revalidated so a stale cached page never references
        # deleted hashed asset chunks after a deploy.
        add_header Cache-Control "no-cache";
    }

    # Fingerprinted build output (/assets/ and /sync-app/assets/) — safe to
    # cache forever. Must stay above the extension regex below.
    location ~ ^/(sync-app/)?assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unhashed files from docs/public/ (logos, images, bench data, the demo
    # video). Short-lived cache so replacing a file takes effect quickly.
    location ~* \.(?:svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf|mp4|webm|mov|json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }
}
